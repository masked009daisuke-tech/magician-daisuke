"body":5,"r_vwran0":6,"title":7,"slug":8,"_meta":9,"_filter":22,"id":23},"\u003Ch1 data-uid=\"2HDHeir1\" data-time=\"1780289141872\" id=\"index_2HDHeir1\">\u003Cstrong>キックオフイベントで一体感を生む方法｜社員のモチベーションを高める成功のポイント\u003C\u002Fstrong>\u003C\u002Fh1>\u003Ch2 data-uid=\"bMYa9JJ8\" data-time=\"1780289141872\" id=\"index_bMYa9JJ8\">\u003Cstrong>メタディスクリプション\u003C\u002Fstrong>\u003C\u002Fh2>\u003Cp data-uid=\"lGiNZtX2\" data-time=\"1780289141872\">キックオフイベントを成功させたい担当者様へ。一体感を生み、社員のモチベーション向上につながる企画や演出方法を詳しく解説します。企業イベントや社員総会にもおすすめです。\u003C\u002Fp>\u003Chr data-uid=\"RwHKyp58\" data-time=\"1780289141872\">\u003Ch1 data-uid=\"eVcQKMRm\" data-time=\"1780289141872\" id=\"index_eVcQKMRm\">\u003Cstrong>キックオフイベントで一体感を生む方法\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"5FAe0AMF\" data-time=\"1780289141872\">企業におけるキックオフイベントは、新年度や新しいプロジェクトのスタートを飾る重要なイベントです。\u003C\u002Fp>\u003Cp data-uid=\"YJ3khmZo\" data-time=\"1780289141872\">しかし、\u003C\u002Fp>\u003Cul data-uid=\"sco9dpPc\" data-time=\"1780289141872\">\u003Cli data-uid=\"Qurx1DwD\" data-time=\"1780289141872\">\u003Cp data-uid=\"3HRzK5us\" data-time=\"1780289141872\">社員が受け身になってしまう\u003C\u002Fp>\u003C\u002Fli>\u003Cli data-uid=\"Kz8m8_cn\" data-time=\"1780289141872\">\u003Cp data-uid=\"Yh4F4KOM\" data-time=\"1780289141872\">経営方針の共有だけで終わる\u003C\u002Fp>\u003C\u002Fli>\u003Cli data-uid=\"y0FpyeBy\" data-time=\"1780289141872\">\u003Cp data-uid=\"RgGDtnXO\" data-time=\"1780289141872\">盛り上がりに欠ける\u003C\u002Fp>\u003C\u002Fli>\u003Cli data-uid=\"1Yd2ulqb\" data-time=\"1780289141872\">\u003Cp data-uid=\"KjYSGueo\" data-time=\"1780289141872\">部署間の交流が少ない\u003C\u002Fp>\u003C\u002Fli>\u003C\u002Ful>\u003Cp data-uid=\"d0M8Xipy\" data-time=\"1780289141872\">といった課題を抱える企業も少なくありません。\u003C\u002Fp>\u003Cp data-uid=\"6wFB6P66\" data-time=\"1780289141873\">せっかく時間と予算をかけて開催するのであれば、\u003C\u002Fp>\u003Cp data-uid=\"1suTBPbI\" data-time=\"1780289141873\">\u003Cstrong>「よし、今年も頑張ろう！」\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"00H7pgB2\" data-time=\"1780289141873\">と思えるイベントにしたいものです。\u003C\u002Fp>\u003Cp data-uid=\"Mm3dWJxk\" data-time=\"1780289141873\">本記事では、キックオフイベントで一体感を生み出す方法について詳しくご紹介します。\u003C\u002Fp>\u003Chr data-uid=\"bqmrR61C\" data-time=\"1780289141873\">\u003Ch1 data-uid=\"mDitfYB2\" data-time=\"1780289141873\" id=\"index_mDitfYB2\">\u003Cstrong>キックオフイベントの目的とは？\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"ZVDttZBf\" data-time=\"1780289141873\">まずは目的を明確にしましょう。\u003C\u002Fp>\u003Cp data-uid=\"a1KZomog\" data-time=\"1780289141873\">キックオフイベントには主に以下の目的があります。\u003C\u002Fp>\u003Ch3 data-uid=\"f7Zndc2b\" data-time=\"1780289141873\" id=\"index_f7Zndc2b\">\u003Cstrong>経営方針の共有\u003C\u002Fstrong>\u003C\u002Fh3>\u003Cp data-uid=\"hKhOW7mb\" data-time=\"1780289141873\">会社の方向性や目標を全社員へ伝える場です。\u003C\u002Fp>\u003Chr data-uid=\"pQB_RMYc\" data-time=\"1780289141873\">\u003Ch3 data-uid=\"CRnUomfd\" data-time=\"1780289141873\" id=\"index_CRnUomfd\">\u003Cstrong>モチベーション向上\u003C\u002Fstrong>\u003C\u002Fh3>\u003Cp data-uid=\"GVYruQdF\" data-time=\"1780289141873\">新しい期のスタートに向けて意欲を高めます。\u003C\u002Fp>\u003Chr data-uid=\"pRJFfLXl\" data-time=\"1780289141873\">\u003Ch3 data-uid=\"jfoCsQQE\" data-time=\"1780289141873\" id=\"index_jfoCsQQE\">\u003Cstrong>部署間交流\u003C\u002Fstrong>\u003C\u002Fh3>\u003Cp data-uid=\"pAlLofGK\" data-time=\"1780289141873\">普段接点の少ない社員同士が交流する機会になります。\u003C\u002Fp>\u003Chr data-uid=\"ad1dNqzz\" data-time=\"1780289141873\">\u003Ch3 data-uid=\"KqufPmpF\" data-time=\"1780289141873\" id=\"index_KqufPmpF\">\u003Cstrong>一体感の醸成\u003C\u002Fstrong>\u003C\u002Fh3>\u003Cp data-uid=\"ksDzCEas\" data-time=\"1780289141873\">社員全員が同じ目標に向かって進むための空気づくりが重要です。\u003C\u002Fp>\u003Chr data-uid=\"T8bXJvy6\" data-time=\"1780289141873\">\u003Ch1 data-uid=\"YUj3CNCe\" data-time=\"1780289141873\" id=\"index_YUj3CNCe\">\u003Cstrong>なぜ一体感が重要なのか\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"LQ83wb5o\" data-time=\"1780289141873\">企業の成果は個人だけでは生まれません。\u003C\u002Fp>\u003Cp data-uid=\"woiQg_cF\" data-time=\"1780289141873\">営業、事務、管理職、現場スタッフなど、\u003C\u002Fp>\u003Cp data-uid=\"V7g8AgAU\" data-time=\"1780289141873\">さまざまな部署が協力することで成果につながります。\u003C\u002Fp>\u003Cp data-uid=\"YHIKgzwF\" data-time=\"1780289141873\">だからこそ、\u003C\u002Fp>\u003Cp data-uid=\"6TgUbiVa\" data-time=\"1780289141873\">「会社全体で頑張ろう」\u003C\u002Fp>\u003Cp data-uid=\"OnG0z2o1\" data-time=\"1780289141873\">という空気づくりが重要なのです。\u003C\u002Fp>\u003Chr data-uid=\"04b4CheZ\" data-time=\"1780289141873\">\u003Ch1 data-uid=\"D0F0zsfq\" data-time=\"1780289141873\" id=\"index_D0F0zsfq\">\u003Cstrong>キックオフイベントでよくある失敗\u003C\u002Fstrong>\u003C\u002Fh1>\u003Ch2 data-uid=\"eYuW82rj\" data-time=\"1780289141873\" id=\"index_eYuW82rj\">\u003Cstrong>話を聞くだけで終わる\u003C\u002Fstrong>\u003C\u002Fh2>\u003Cp data-uid=\"Ip806_Bo\" data-time=\"1780289141873\">社長挨拶や事業方針説明だけだと、\u003C\u002Fp>\u003Cp data-uid=\"SL50nERa\" data-time=\"1780289141873\">社員は受け身になってしまいます。\u003C\u002Fp>\u003Chr data-uid=\"ApzWv1XF\" data-time=\"1780289141873\">\u003Ch2 data-uid=\"6A0c1Jv_\" data-time=\"1780289141874\" id=\"index_6A0c1Jv_\">\u003Cstrong>部署ごとに固まる\u003C\u002Fstrong>\u003C\u002Fh2>\u003Cp data-uid=\"zDFPNRuF\" data-time=\"1780289141874\">交流の機会がなければ、\u003C\u002Fp>\u003Cp data-uid=\"CK6CQMET\" data-time=\"1780289141874\">普段と変わらない座席配置になりがちです。\u003C\u002Fp>\u003Chr data-uid=\"dWWWJXjS\" data-time=\"1780289141874\">\u003Ch2 data-uid=\"juTMmxsf\" data-time=\"1780289141874\" id=\"index_juTMmxsf\">\u003Cstrong>記憶に残らない\u003C\u002Fstrong>\u003C\u002Fh2>\u003Cp data-uid=\"vIvOxMJj\" data-time=\"1780289141874\">イベント終了後、\u003C\u002Fp>\u003Cp data-uid=\"SzkanJNH\" data-time=\"1780289141874\">内容をほとんど覚えていないケースもあります。\u003C\u002Fp>\u003Chr data-uid=\"FXG6IJYu\" data-time=\"1780289141874\">\u003Cfigure data-uid=\"aSlESUom\" data-time=\"1780289507164\" data-thread=\"\" style=\"\">\u003Cimg src=\"https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-design-asset-files\u002Fprojects\u002FEXawALKDOD\u002Fs-1672x941_v-fms_webp_766884bc-5556-41d7-bac6-c7e8a0af9668.png\" alt=\"\" width=\"\" height=\"\">\u003Cfigcaption>\u003C\u002Ffigcaption>\u003C\u002Ffigure>\u003Chr data-uid=\"S29ZShTC\" data-time=\"1780289141874\">\u003Ch1 data-uid=\"8J7oc9Ma\" data-time=\"1780289141874\" id=\"index_8J7oc9Ma\">\u003Cstrong>一体感を生むためのポイント\u003C\u002Fstrong>\u003C\u002Fh1>\u003Ch2 data-uid=\"6GxYEHyd\" data-time=\"1780289141874\" id=\"index_6GxYEHyd\">\u003Cstrong>① 全員参加型にする\u003C\u002Fstrong>\u003C\u002Fh2>\u003Cp data-uid=\"dUGyDhjd\" data-time=\"1780289141874\">一部の人だけが楽しむイベントではなく、\u003C\u002Fp>\u003Cp data-uid=\"v9SOQBtU\" data-time=\"1780289141874\">全員が参加できる仕組みが重要です。\u003C\u002Fp>\u003Cp data-uid=\"_se8_2nC\" data-time=\"1780289141874\">例えば、\u003C\u002Fp>\u003Cul data-uid=\"lw1vY0PG\" data-time=\"1780289141874\">\u003Cli data-uid=\"lpt_2862\" data-time=\"1780289141874\">\u003Cp data-uid=\"KyDCzRfS\" data-time=\"1780289141874\">グループワーク\u003C\u002Fp>\u003C\u002Fli>\u003Cli data-uid=\"W6NGzGRv\" data-time=\"1780289141874\">\u003Cp data-uid=\"aRSYLZ9R\" data-time=\"1780289141874\">チーム対抗企画\u003C\u002Fp>\u003C\u002Fli>\u003Cli data-uid=\"OUQPEpMZ\" data-time=\"1780289141874\">\u003Cp data-uid=\"uNQ9fROa\" data-time=\"1780289141874\">参加型演出\u003C\u002Fp>\u003C\u002Fli>\u003C\u002Ful>\u003Cp data-uid=\"Hl0k7lB_\" data-time=\"1780289141874\">などがあります。\u003C\u002Fp>\u003Chr data-uid=\"Ys7oalUW\" data-time=\"1780289141874\">\u003Ch2 data-uid=\"HSfhbXXr\" data-time=\"1780289141874\" id=\"index_HSfhbXXr\">\u003Cstrong>② 共通体験を作る\u003C\u002Fstrong>\u003C\u002Fh2>\u003Cp data-uid=\"xEpEhoUl\" data-time=\"1780289141874\">人は同じ体験を共有すると距離が縮まります。\u003C\u002Fp>\u003Cp data-uid=\"KNjAWEZc\" data-time=\"1780289141874\">例えば、\u003C\u002Fp>\u003Cul data-uid=\"fpQ4sof_\" data-time=\"1780289141874\">\u003Cli data-uid=\"UAHZBWTE\" data-time=\"1780289141874\">\u003Cp data-uid=\"4k977VvG\" data-time=\"1780289141874\">感動した\u003C\u002Fp>\u003C\u002Fli>\u003Cli data-uid=\"FEyCfPWA\" data-time=\"1780289141874\">\u003Cp data-uid=\"yyRRZCxu\" data-time=\"1780289141874\">笑った\u003C\u002Fp>\u003C\u002Fli>\u003Cli data-uid=\"NHMqlvub\" data-time=\"1780289141874\">\u003Cp data-uid=\"5T2ugyau\" data-time=\"1780289141874\">驚いた\u003C\u002Fp>\u003C\u002Fli>\u003C\u002Ful>\u003Cp data-uid=\"Mm2tZq2u\" data-time=\"1780289141874\">という体験です。\u003C\u002Fp>\u003Chr data-uid=\"cgnyfchk\" data-time=\"1780289141874\">\u003Ch2 data-uid=\"37eHhEHc\" data-time=\"1780289141875\" id=\"index_37eHhEHc\">\u003Cstrong>③ 感情を動かす\u003C\u002Fstrong>\u003C\u002Fh2>\u003Cp data-uid=\"s_s0sVuW\" data-time=\"1780289141875\">人は数字や資料よりも、\u003C\u002Fp>\u003Cp data-uid=\"bIXiwrQz\" data-time=\"1780289141875\">感情が動いた出来事を記憶します。\u003C\u002Fp>\u003Cp data-uid=\"STzrJg1q\" data-time=\"1780289141875\">そのため、\u003C\u002Fp>\u003Cp data-uid=\"Wvp6_ure\" data-time=\"1780289141875\">驚きや感動を生み出す演出が効果的です。\u003C\u002Fp>\u003Chr data-uid=\"ckSd95Bk\" data-time=\"1780289141875\">\u003Ch1 data-uid=\"aaehewxc\" data-time=\"1780289141875\" id=\"index_aaehewxc\">\u003Cstrong>キックオフイベントで人気の演出\u003C\u002Fstrong>\u003C\u002Fh1>\u003Ch2 data-uid=\"kdXFkWAj\" data-time=\"1780289141875\" id=\"index_kdXFkWAj\">\u003Cstrong>表彰式\u003C\u002Fstrong>\u003C\u002Fh2>\u003Cp data-uid=\"mdoyPgN5\" data-time=\"1780289141875\">前期の成果を称えることで、\u003C\u002Fp>\u003Cp data-uid=\"HuWJZvbO\" data-time=\"1780289141875\">社員のモチベーション向上につながります。\u003C\u002Fp>\u003Chr data-uid=\"4zebRGsj\" data-time=\"1780289141875\">\u003Ch2 data-uid=\"JH2sXATb\" data-time=\"1780289141875\" id=\"index_JH2sXATb\">\u003Cstrong>ムービー上映\u003C\u002Fstrong>\u003C\u002Fh2>\u003Cp data-uid=\"XpEdHFYo\" data-time=\"1780289141875\">会社の歩みや未来を映像で共有します。\u003C\u002Fp>\u003Chr data-uid=\"BaaIiO3f\" data-time=\"1780289141875\">\u003Ch2 data-uid=\"bI9X5p5h\" data-time=\"1780289141875\" id=\"index_bI9X5p5h\">\u003Cstrong>社員参加型企画\u003C\u002Fstrong>\u003C\u002Fh2>\u003Cp data-uid=\"3xXgUw2O\" data-time=\"1780289141875\">部署を超えた交流が生まれます。\u003C\u002Fp>\u003Chr data-uid=\"Czauykjc\" data-time=\"1780289141875\">\u003Ch2 data-uid=\"zCEeVwGL\" data-time=\"1780289141875\" id=\"index_zCEeVwGL\">\u003Cstrong>マジックショー\u003C\u002Fstrong>\u003C\u002Fh2>\u003Cp data-uid=\"0DDvox_W\" data-time=\"1780289141875\">近年、企業イベントで非常に人気が高まっています。\u003C\u002Fp>\u003Chr data-uid=\"8SUUQtw6\" data-time=\"1780289141875\">\u003Ch1 data-uid=\"S819GCV1\" data-time=\"1780289141875\" id=\"index_S819GCV1\">\u003Cstrong>なぜマジックショーが一体感を生むのか\u003C\u002Fstrong>\u003C\u002Fh1>\u003Ch2 data-uid=\"Aj9u5HgE\" data-time=\"1780289141875\" id=\"index_Aj9u5HgE\">\u003Cstrong>会場全体が同じ体験を共有できる\u003C\u002Fstrong>\u003C\u002Fh2>\u003Cp data-uid=\"Jdq4yzfw\" data-time=\"1780289141875\">マジックを見ると、\u003C\u002Fp>\u003Cp data-uid=\"dvUE5Acp\" data-time=\"1780289141875\">全員が同じタイミングで驚きます。\u003C\u002Fp>\u003Cp data-uid=\"O4RGorVn\" data-time=\"1780289141875\">その結果、\u003C\u002Fp>\u003Cp data-uid=\"cuWNu_y4\" data-time=\"1780289141875\">自然と一体感が生まれます。\u003C\u002Fp>\u003Chr data-uid=\"zC_9bovI\" data-time=\"1780289141875\">\u003Ch2 data-uid=\"WoENZtCi\" data-time=\"1780289141875\" id=\"index_WoENZtCi\">\u003Cstrong>年齢や役職を問わず楽しめる\u003C\u002Fstrong>\u003C\u002Fh2>\u003Cp data-uid=\"Fr6gIzF4\" data-time=\"1780289141875\">キックオフイベントには、\u003C\u002Fp>\u003Cul data-uid=\"b7hCxtmN\" data-time=\"1780289141875\">\u003Cli data-uid=\"TUtqMicd\" data-time=\"1780289141875\">\u003Cp data-uid=\"zF4490O5\" data-time=\"1780289141875\">新入社員\u003C\u002Fp>\u003C\u002Fli>\u003Cli data-uid=\"ngje9gbK\" data-time=\"1780289141875\">\u003Cp data-uid=\"wbwYMudb\" data-time=\"1780289141875\">ベテラン社員\u003C\u002Fp>\u003C\u002Fli>\u003Cli data-uid=\"g64fISno\" data-time=\"1780289141875\">\u003Cp data-uid=\"0EG191AR\" data-time=\"1780289141875\">管理職\u003C\u002Fp>\u003C\u002Fli>\u003Cli data-uid=\"0FuTX2_Z\" data-time=\"1780289141875\">\u003Cp data-uid=\"WNw1fzYv\" data-time=\"1780289141876\">経営層\u003C\u002Fp>\u003C\u002Fli>\u003C\u002Ful>\u003Cp data-uid=\"GwViDQOn\" data-time=\"1780289141876\">など様々な立場の方が参加します。\u003C\u002Fp>\u003Cp data-uid=\"DoOn4LsM\" data-time=\"1780289141876\">マジックは全員が楽しめる数少ないエンターテインメントです。\u003C\u002Fp>\u003Chr data-uid=\"1X6_sRMJ\" data-time=\"1780289141876\">\u003Ch2 data-uid=\"M8joRM6B\" data-time=\"1780289141876\" id=\"index_M8joRM6B\">\u003Cstrong>参加型にできる\u003C\u002Fstrong>\u003C\u002Fh2>\u003Cp data-uid=\"8I4UwbCz\" data-time=\"1780289141876\">社員や役員に協力していただくことで、\u003C\u002Fp>\u003Cp data-uid=\"Zk8YrLGc\" data-time=\"1780289141876\">会場全体が盛り上がります。\u003C\u002Fp>\u003Chr data-uid=\"WIqB1Hr8\" data-time=\"1780289141876\">\u003Ch1 data-uid=\"6HzORxVs\" data-time=\"1780289141876\" id=\"index_6HzORxVs\">\u003Cstrong>キックオフイベントで人気のマジック演出\u003C\u002Fstrong>\u003C\u002Fh1>\u003Ch2 data-uid=\"j4ie5G0W\" data-time=\"1780289141876\" id=\"index_j4ie5G0W\">\u003Cstrong>オープニング演出\u003C\u002Fstrong>\u003C\u002Fh2>\u003Cp data-uid=\"3Jqr7ip4\" data-time=\"1780289141876\">イベント開始直後に大きな驚きを生み出します。\u003C\u002Fp>\u003Cp data-uid=\"39U3hfCF\" data-time=\"1780289141876\">期待感が一気に高まります。\u003C\u002Fp>\u003Chr data-uid=\"in5l39Kd\" data-time=\"1780289141876\">\u003Ch2 data-uid=\"DTVZ3lUI\" data-time=\"1780289141876\" id=\"index_DTVZ3lUI\">\u003Cstrong>企業理念出現演出\u003C\u002Fstrong>\u003C\u002Fh2>\u003Cp data-uid=\"jNaMJXNx\" data-time=\"1780289141876\">会社のビジョンやスローガンをマジックで出現させます。\u003C\u002Fp>\u003Cp data-uid=\"AbsCFsG2\" data-time=\"1780289141876\">キックオフイベントとの相性抜群です。\u003C\u002Fp>\u003Chr data-uid=\"r1o28u0C\" data-time=\"1780289141876\">\u003Ch2 data-uid=\"sZw_86nB\" data-time=\"1780289141876\" id=\"index_sZw_86nB\">\u003Cstrong>目標発表演出\u003C\u002Fstrong>\u003C\u002Fh2>\u003Cp data-uid=\"9ZOpUnD0\" data-time=\"1780289141876\">今年の目標やテーマをマジックで発表します。\u003C\u002Fp>\u003Cp data-uid=\"0C1RXfjQ\" data-time=\"1780289141876\">印象に残りやすくなります。\u003C\u002Fp>\u003Chr data-uid=\"s1Yq71fo\" data-time=\"1780289141876\">\u003Ch2 data-uid=\"fzbqLIZu\" data-time=\"1780289141876\" id=\"index_fzbqLIZu\">\u003Cstrong>社員参加型マジック\u003C\u002Fstrong>\u003C\u002Fh2>\u003Cp data-uid=\"LLRctXeP\" data-time=\"1780289141876\">社員自身が主役になるため、\u003C\u002Fp>\u003Cp data-uid=\"UdwYYGtt\" data-time=\"1780289141876\">非常に盛り上がります。\u003C\u002Fp>\u003Chr data-uid=\"z6p5XXxo\" data-time=\"1780289141876\">\u003Cfigure data-uid=\"eyFEezFK\" data-time=\"1780289526892\" data-thread=\"\" style=\"\">\u003Cimg src=\"https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-design-asset-files\u002Fprojects\u002FEXawALKDOD\u002Fs-1672x941_v-fms_webp_5e44fded-af90-4798-9fe4-3ccb2c3b3655.png\" alt=\"\" width=\"\" height=\"\">\u003Cfigcaption>\u003C\u002Ffigcaption>\u003C\u002Ffigure>\u003Chr data-uid=\"89zXasH3\" data-time=\"1780289141876\">\u003Ch1 data-uid=\"UGINH0j2\" data-time=\"1780289141876\" id=\"index_UGINH0j2\">\u003Cstrong>マジシャンDaiSukeのキックオフイベント出演\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"E2qX4Bn3\" data-time=\"1780289141876\">マジシャンDaiSukeは、\u003C\u002Fp>\u003Cp data-uid=\"N5St_soT\" data-time=\"1780289141876\">「世界一明るい障害者マジシャン」\u003C\u002Fp>\u003Cp data-uid=\"IitSQtke\" data-time=\"1780289141876\">として活動しています。\u003C\u002Fp>\u003Cp data-uid=\"YwuFOfPw\" data-time=\"1780289141877\">左目失明、右目視野障害という困難を抱えながらも、\u003C\u002Fp>\u003Cp data-uid=\"qT_BO_zW\" data-time=\"1780289141877\">数多くの企業イベントで笑顔と感動を届けています。\u003C\u002Fp>\u003Cp data-uid=\"FRrYSdW2\" data-time=\"1780289141877\">キックオフイベントでは、\u003C\u002Fp>\u003Cul data-uid=\"ftYs92hY\" data-time=\"1780289141877\">\u003Cli data-uid=\"mlXthNt8\" data-time=\"1780289141877\">\u003Cp data-uid=\"LhmHXXkd\" data-time=\"1780289141877\">ステージマジック\u003C\u002Fp>\u003C\u002Fli>\u003Cli data-uid=\"Re3NM0XD\" data-time=\"1780289141877\">\u003Cp data-uid=\"BKwEVEi3\" data-time=\"1780289141877\">参加型マジック\u003C\u002Fp>\u003C\u002Fli>\u003Cli data-uid=\"hQGjBSk9\" data-time=\"1780289141877\">\u003Cp data-uid=\"UYmOCua1\" data-time=\"1780289141877\">表彰演出\u003C\u002Fp>\u003C\u002Fli>\u003Cli data-uid=\"0VfwImrB\" data-time=\"1780289141877\">\u003Cp data-uid=\"2UDwZBHr\" data-time=\"1780289141877\">企業理念出現演出\u003C\u002Fp>\u003C\u002Fli>\u003C\u002Ful>\u003Cp data-uid=\"2WCoQeiB\" data-time=\"1780289141877\">など、企業様に合わせたオリジナル演出が可能です。\u003C\u002Fp>\u003Cp data-uid=\"2DU9WUOe\" data-time=\"1780289141877\">単なる余興ではなく、\u003C\u002Fp>\u003Cp data-uid=\"e5FZNHdc\" data-time=\"1780289141877\">\u003Cstrong>社員の心を一つにする演出\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"fS3530EN\" data-time=\"1780289141877\">としてご活用いただいております。\u003C\u002Fp>\u003Chr data-uid=\"iN8q2tp0\" data-time=\"1780289141877\">\u003Ch1 data-uid=\"D1_kWIHF\" data-time=\"1780289141877\" id=\"index_D1_kWIHF\">\u003Cstrong>まとめ\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"2bV_NA3O\" data-time=\"1780289141877\">キックオフイベントで一体感を生み出すためには、\u003C\u002Fp>\u003Cul data-uid=\"j5ySRDCe\" data-time=\"1780289141877\">\u003Cli data-uid=\"j9aYeb_L\" data-time=\"1780289141877\">\u003Cp data-uid=\"f4IfqBvU\" data-time=\"1780289141877\">全員参加\u003C\u002Fp>\u003C\u002Fli>\u003Cli data-uid=\"daNGtJWB\" data-time=\"1780289141877\">\u003Cp data-uid=\"rsG7kamX\" data-time=\"1780289141877\">共通体験\u003C\u002Fp>\u003C\u002Fli>\u003Cli data-uid=\"nPUvvs_4\" data-time=\"1780289141877\">\u003Cp data-uid=\"0zFBq9wx\" data-time=\"1780289141877\">感情を動かす演出\u003C\u002Fp>\u003C\u002Fli>\u003C\u002Ful>\u003Cp data-uid=\"yBaHCto3\" data-time=\"1780289141877\">が重要です。\u003C\u002Fp>\u003Cp data-uid=\"eNmURA_b\" data-time=\"1780289141877\">マジックショーは、\u003C\u002Fp>\u003Cul data-uid=\"MSsb70gh\" data-time=\"1780289141877\">\u003Cli data-uid=\"cuBKKMlB\" data-time=\"1780289141877\">\u003Cp data-uid=\"ZscWrcDU\" data-time=\"1780289141877\">驚き\u003C\u002Fp>\u003C\u002Fli>\u003Cli data-uid=\"63tCIej2\" data-time=\"1780289141877\">\u003Cp data-uid=\"onKjVJ2q\" data-time=\"1780289141877\">感動\u003C\u002Fp>\u003C\u002Fli>\u003Cli data-uid=\"GRJISl4j\" data-time=\"1780289141877\">\u003Cp data-uid=\"KSQYSNiL\" data-time=\"1780289141877\">笑顔\u003C\u002Fp>\u003C\u002Fli>\u003C\u002Ful>\u003Cp data-uid=\"NWbFRz8u\" data-time=\"1780289141877\">を同時に生み出し、\u003C\u002Fp>\u003Cp data-uid=\"7hWjOc5r\" data-time=\"1780289141877\">社員同士の距離を縮めることができます。\u003C\u002Fp>\u003Cp data-uid=\"pAQZGUk3\" data-time=\"1780289141877\">新しいスタートを成功させるために、\u003C\u002Fp>\u003Cp data-uid=\"j4crx9tP\" data-time=\"1780289141878\">ぜひキッ "og:image":166},"出張マジシャンをお探しならマジシャンDaiSukeへ。企業イベント、懇親会、周年記念、キックオフイベント、学校公演、高齢者施設、地域イベントに対応。出張マジックショー・イベント演出・マジシャン派遣を全国で承ります。","\u002F","51e2c374-24bd-4647-b8a8-bfaa237804db",[172,173],{"head":192,"id":196,"type":169,"uuid":197,"symbolIds":198},{"meta":193,"title":195},{"description":194,"og:image":44},"視覚障がいというハンディキャップを持ちながらも、全国で活躍するプロマジシャンDaiSukeの想いと歩みを紹介。“人を元気にしたい”という信念のもと、障がいをものともせず挑戦を続けてきたストーリーは、マジックという枠を超えて多くの人の心を動かしています。テレビ出演、講演活動、学校や福祉施設でのマジックショーなど多岐にわたる活動歴は、信頼と実績の証。プロフィールページでは、その人間力と表現力の源に触れていただけます。","マジシャンDaiSukeのプロフィール｜笑顔と感動を届けるパフォーマー","プロフィール","9c06f365-71ab-4327-a8ba-9ad543502d5e",[172,173],{"head":200,"id":202,"type":169,"uuid":203,"symbolIds":204},{"meta":201,"title":195},{"description":194,"og:image":44},"プロフィール-2","8ea7d5e2-fb70-43ac-b472-f69352a61c97",[172,173],{"head":206,"id":210,"type":169,"uuid":211,"symbolIds":212},{"meta":207,"title":209},{"description":208,"og:image":44},"マジシャンDaiSukeが出演してきた豊富な実績を詳しくご紹介。福祉施設での笑顔あふれるショー、小学校・中学校での感動のステージ、企業イベントでの華やかな演出、地域のお祭りでの観客参加型マジックなど、あらゆるシーンに対応してきた経験が、信頼の証です。各会場での観客の反応や構成の工夫も掲載し、“自分たちのイベントにも呼べるのか？”という疑問に具体的に答えます。ご依頼前に、実際の活躍例を確認いただくことで、イメージが明確になり安心してご相談いただけます。","マジシャンDaiSukeの出演実績｜企業イベント・結婚式・福祉施設・学校など多彩なマジックショー","過去の実績","629eed42-2e47-4311-a7a8-57b3778bbad2",[172,173],{"head":214,"id":218,"type":169,"uuid":219,"symbolIds":220},{"meta":215,"title":217},{"description":216},"マジシャンDaiSukeでは、イベントの規模や目的、ご予算に合わせた柔軟なプランを多数ご用意。30分のコンパクトなマジックショーから、1時間のフルステージ演出、子ども向けのワークショップ、講演とマジックの組み合わせプランまで、幅広いニーズに応えます。施設向け、企業向け、学校向け、個人イベント向けなど、それぞれに最適な構成をご提案可能。“どんな内容になるのか想像がつかない”“予算に応じた提案がほしい”という方は、ぜひこのページでご確認ください。","マジシャンDaiSukeのプラン一覧","プラン一覧","b7f6b3b3-2342-4cf0-b141-cf61ac5a29f2",[172,173],{"head":222,"id":224,"type":169,"uuid":225,"symbolIds":226},{"meta":223,"title":217},{"description":216},"プラン一覧-2","2543dbd8-cbdf-4efb-93e5-ad4d4a84f788",[172,173],{"head":228,"id":232,"type":169,"uuid":233,"symbolIds":234},{"meta":229,"title":231},{"description":230,"og:image":44},"初めてマジックショーを依頼する方でも安心できるよう、DaiSukeへの出演依頼から当日までの流れをわかりやすく解説しています。お問い合わせからヒアリング、プランのご提案、リハーサル、当日の対応までを丁寧にご説明。イベントの規模や会場に合わせた柔軟な演出、音響・照明のサポート、バリアフリー対応の配慮など、実際の流れに即した内容で不安を取り除きます。“出演を頼むのはハードルが高そう…”と感じる方にこそ見ていただきたい安心のガイドページです。","マジシャンDaiSukeへのご依頼の流れをご案内。お問い合わせ→ヒアリング→ご提案→本番当日まで、安心のサポート体制です。","ご依頼までの流れ","1816adb8-9a70-4150-b91a-2563611d15b8",[172,173],{"head":236,"id":240,"type":169,"uuid":241,"symbolIds":242},{"meta":237,"title":239},{"description":238,"og:image":44},"マジシャンDaiSukeのパフォーマンスを体験されたお客様から届いた、心温まる声やリアルな感想を掲載。福祉施設での感動的な反応、学校公演での生徒の笑顔、企業イベントでの盛り上がりなど、幅広いシーンでの“ありがとう”が詰まったページです。“驚きと笑いでいっぱいだった”“また来てほしいとリクエストが止まらなかった”など、実際に見た人の声が、マジックの価値を物語ります。ご検討中の方の安心材料として、信頼の証をぜひご覧ください。","マジシャンDaiSukeのお客様の声｜マジシャンDaiSukeのマジックショーで感動した体験談","お客様の声","89cfd851-10bd-4d1e-9f94-77db36f92c64",[172,173],{"head":244,"id":248,"type":169,"uuid":249,"symbolIds":250},{"meta":245,"title":247},{"description":246,"og:image":44},"マジシャンDaiSukeへの出演依頼を検討中の方向けに、よくある質問をQ&A形式で丁寧にまとめたページです。料金の目安、ショーの時間や内容、音響設備の必要性、子ども向け・高齢者向けの演出の違い、障がいがある方への対応、会場が狭い場合の工夫など、これまで多くの方が感じた疑問にすべてお答えします。“初めてでも安心できるか”“失敗しないためには何を確認すればいいのか”を事前に知ることができ、問い合わせの前に不安を解消できます。","よくある質問｜マジックショーの依頼・準備・料金などをわかりやすく解説","よくある質問","e86c0aa9-a6b4-46f5-8296-567398fad6e0",[172,173],{"head":252,"id":256,"type":169,"uuid":257,"symbolIds":258},{"meta":253,"title":255},{"description":254,"og:image":44},"マジシャンDaiSukeがこれまでに出演したマジックショーの様子を、写真や動画で豊富に紹介するギャラリーページ。福祉施設・企業イベント・学校公演・地域のお祭りなど、年齢や場所を問わず、観客の笑顔と驚きに包まれたリアルな瞬間が多数掲載されています。視覚障がいというハンディキャップを乗り越えた感動のステージ、子どもたちの純粋なリアクション、ステージ演出の工夫など、マジックショーの雰囲気を事前にしっかり確認できます。“どんな雰囲気か知りたい”“実績を写真で見たい”“依頼前に参考にしたい”という方に最適。マジックパフォーマンスの臨場感と、DaiSukeの世界観がひと目で伝わるギャラリーは、安心感と期待感を高める重要コンテンツです。","マジシャンDaiSukeのギャラリー｜笑顔あふれるパフォーマンスの瞬間","ギャラリー","70c1267e-a2c7-4754-a0dc-4f4a13c21a07",[172,173],{"head":260,"id":265,"type":169,"uuid":266,"symbolIds":267},{"favicon":261,"meta":262,"title":264},"https:\u002F\u002Fstorage.googleapis.com\u002Fproduction-os-assets\u002Fassets\u002F2840c74c-a928-42c4-b883-9811e95cf9ed",{"description":263,"og:image":166},"マジシャンDaiSukeへの出演依頼・料金相談・日程確認・講演依頼など、あらゆるお問い合わせを受け付ける専用フォームページです。企業のイベントご担当者様、福祉施設のご関係者、学校関係者、地域イベント主催者、個人のお客様まで、どなたでもお気軽にご相談可能です。イベントの目的や規模、ご予算、ご希望日時、会場の条件に応じた柔軟なご提案が可能で、“初めてでよくわからない”という方にも丁寧に対応。お問い合わせ後は迅速かつ丁寧な対応を心がけており、演出内容や料金についての不安や疑問もすぐに解消できます。感動と笑顔を届ける出張マジックを成功させたいすべての方へ、最初の一歩を安心して踏み出せる窓口です。","出演依頼・お問い合わせ｜マジシャンDaiSukeへのご連絡はこちら","お問い合わせ","aa5bf87e-f6b2-4a20-9580-cd3f0feeb27b",[172,173],{"head":269,"id":271,"type":169,"uuid":272,"symbolIds":273},{"meta":270,"title":44},{"description":44,"og:image":44},"プライバシーポリシー","78550ddf-32c2-4037-a7ad-adf135adbe62",[172,173],{"head":275,"id":278,"isPrivate":29,"type":279,"uuid":280,"symbolIds":281},{"meta":276,"title":44},{"robots":277},"noindex","8","password","4bcc7fe6-2aac-4990-98a2-12d489161f62",[],{"head":283,"id":286,"type":169,"uuid":287,"symbolIds":288},{"favicon":284,"meta":285,"title":44},"https:\u002F\u002Fstorage.googleapis.com\u002Fproduction-os-assets\u002Fassets\u002Ffd1aad11-cd0e-4425-bab5-b8ffa17d6e98",{"description":44,"og:image":44},"404","c11981a5-b5ee-428c-b29f-52783831cd94",[172,173,289],"2b2573a3-d591-4e60-a40c-77d23ef70002",{"head":291,"id":293,"type":169,"uuid":294,"symbolIds":295},{"meta":292,"title":44},{"description":44,"og:image":44},"cms","0060ba44-d5fd-4d21-8be7-12fc905d04a9",[172,173],{"id":297,"isCookieModal":46,"isPrivate":29,"responsive":29,"type":298,"uuid":299,"symbolIds":300},"2-14","modal","5712d176-b93e-4e2a-9f0b-e9956acbce1b",[],{"id":302,"isCookieModal":46,"isPrivate":29,"responsive":29,"type":298,"uuid":303,"symbolIds":304},"2-13","fd992b94-1c60-4cc7-8086-432bcc26dba9",[],{"id":306,"isCookieModal":46,"isPrivate":29,"responsive":29,"type":298,"uuid":307,"symbolIds":308},"2-12","06b34706-b16c-4ec3-987f-96329e5496f0",[],{"id":310,"isCookieModal":46,"isPrivate":29,"responsive":29,"type":298,"uuid":311,"symbolIds":312},"2-11","dfda07ae-007e-43c0-9e70-fbc5f11ef8e4",[],{"id":314,"isCookieModal":46,"isPrivate":29,"responsive":29,"type":298,"uuid":315,"symbolIds":316},"2-10","5b785a38-460c-4609-b029-b36839a25bf8",[],{"id":318,"isCookieModal":46,"
