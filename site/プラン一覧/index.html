com\u002Fproduction-os-assets\u002Fassets\u002Fdc358f72-677f-4065-9daa-d79bc7901db4",{"description":145,"og:image":146},"マジシャンDaiSuke公式サイトでは、出張マジックショーのご依頼を全国対応で受付中。企業イベント・福祉施設・学校公演・地域活性イベントなど、幅広いシーンに対応し、笑いと感動を届ける“世界一明るい障がい者マジシャン”DaiSukeのパフォーマンスがご覧いただけます。視覚障がいを乗り越えた圧巻のステージと、観客との心のつながりを大切にする演出が話題。イベントの趣旨や目的に応じたオーダーメイド対応も可能で、実績豊富なプロによる感動体験が、あなたのイベントを特別な時間に変えます。","https:\u002F\u002Fstorage.googleapis.com\u002Fproduction-os-assets\u002Fassets\u002Feb6a6d79-b773-4bae-a97b-0ca9a9f9f8a6","DaiSuke Magic Official","1","page","a7dc6567-cc0d-4084-bd0a-efb362054d28",[152,153],"c25bce14-1fb3-4f95-a833-406c5926b4d0","94b4fcf4-b920-46f6-91db-784cdcafa6ea",{"id":155,"type":149,"uuid":156,"symbolIds":157},"3","afe962c0-65ef-4084-aa88-6347350afc75",[],{"head":159,"id":161,"type":149,"uuid":162,"symbolIds":163},{"favicon":143,"meta":160,"title":147},{"description":145,"og:image":146},"7","84973d2c-44c4-4e97-98a8-ca3ee2b4e57d",[152,153],{"head":165,"id":168,"type":149,"uuid":169,"symbolIds":170},{"favicon":143,"meta":166,"title":23},{"description":167,"og:image":146},"出張マジシャンをお探しならマジシャンDaiSukeへ。企業イベント、懇親会、周年記念、キックオフイベント、学校公演、高齢者施設、地域イベントに対応。出張マジックショー・イベント演出・マジシャン派遣を全国で承ります。","\u002F","51e2c374-24bd-4647-b8a8-bfaa237804db",[152,153],{"head":172,"id":176,"type":149,"uuid":177,"symbolIds":178},{"meta":173,"title":175},{"description":174,"og:image":24},"視覚障がいというハンディキャップを持ちながらも、全国で活躍するプロマジシャンDaiSukeの想いと歩みを紹介。“人を元気にしたい”という信念のもと、障がいをものともせず挑戦を続けてきたストーリーは、マジックという枠を超えて多くの人の心を動かしています。テレビ出演、講演活動、学校や福祉施設でのマジックショーなど多岐にわたる活動歴は、信頼と実績の証。プロフィールページでは、その人間力と表現力の源に触れていただけます。","マジシャンDaiSukeのプロフィール｜笑顔と感動を届けるパフォーマー","プロフィール","9c06f365-71ab-4327-a8ba-9ad543502d5e",[152,153],{"head":180,"id":182,"type":149,"uuid":183,"symbolIds":184},{"meta":181,"title":175},{"description":174,"og:image":24},"プロフィール-2","8ea7d5e2-fb70-43ac-b472-f69352a61c97",[152,153],{"head":186,"id":190,"type":149,"uuid":191,"symbolIds":192},{"meta":187,"title":189},{"description":188,"og:image":24},"マジシャンDaiSukeが出演してきた豊富な実績を詳しくご紹介。福祉施設での笑顔あふれるショー、小学校・中学校での感動のステージ、企業イベントでの華やかな演出、地域のお祭りでの観客参加型マジックなど、あらゆるシーンに対応してきた経験が、信頼の証です。各会場での観客の反応や構成の工夫も掲載し、“自分たちのイベントにも呼べるのか？”という疑問に具体的に答えます。ご依頼前に、実際の活躍例を確認いただくことで、イメージが明確になり安心してご相談いただけます。","マジシャンDaiSukeの出演実績｜企業イベント・結婚式・福祉施設・学校など多彩なマジックショー","過去の実績","629eed42-2e47-4311-a7a8-57b3778bbad2",[152,153],{"head":194,"id":198,"type":149,"uuid":199,"symbolIds":200},{"meta":195,"title":197},{"description":196},"マジシャンDaiSukeでは、イベントの規模や目的、ご予算に合わせた柔軟なプランを多数ご用意。30分のコンパクトなマジックショーから、1時間のフルステージ演出、子ども向けのワークショップ、講演とマジックの組み合わせプランまで、幅広いニーズに応えます。施設向け、企業向け、学校向け、個人イベント向けなど、それぞれに最適な構成をご提案可能。“どんな内容になるのか想像がつかない”“予算に応じた提案がほしい”という方は、ぜひこのページでご確認ください。","マジシャンDaiSukeのプラン一覧","プラン一覧","b7f6b3b3-2342-4cf0-b141-cf61ac5a29f2",[152,153],{"head":202,"id":204,"type":149,"uuid":205,"symbolIds":206},{"meta":203,"title":197},{"description":196},"プラン一覧-2","2543dbd8-cbdf-4efb-93e5-ad4d4a84f788",[152,153],{"head":208,"id":212,"type":149,"uuid":213,"symbolIds":214},{"meta":209,"title":211},{"description":210,"og:image":24},"初めてマジックショーを依頼する方でも安心できるよう、DaiSukeへの出演依頼から当日までの流れをわかりやすく解説しています。お問い合わせからヒアリング、プランのご提案、リハーサル、当日の対応までを丁寧にご説明。イベントの規模や会場に合わせた柔軟な演出、音響・照明のサポート、バリアフリー対応の配慮など、実際の流れに即した内容で不安を取り除きます。“出演を頼むのはハードルが高そう…”と感じる方にこそ見ていただきたい安心のガイドページです。","マジシャンDaiSukeへのご依頼の流れをご案内。お問い合わせ→ヒアリング→ご提案→本番当日まで、安心のサポート体制です。","ご依頼までの流れ","1816adb8-9a70-4150-b91a-2563611d15b8",[152,153],{"head":216,"id":220,"type":149,"uuid":221,"symbolIds":222},{"meta":217,"title":219},{"description":218,"og:image":24},"マジシャンDaiSukeのパフォーマンスを体験されたお客様から届いた、心温まる声やリアルな感想を掲載。福祉施設での感動的な反応、学校公演での生徒の笑顔、企業イベントでの盛り上がりなど、幅広いシーンでの“ありがとう”が詰まったページです。“驚きと笑いでいっぱいだった”“また来てほしいとリクエストが止まらなかった”など、実際に見た人の声が、マジックの価値を物語ります。ご検討中の方の安心材料として、信頼の証をぜひご覧ください。","マジシャンDaiSukeのお客様の声｜マジシャンDaiSukeのマジックショーで感動した体験談","お客様の声","89cfd851-10bd-4d1e-9f94-77db36f92c64",[152,153],{"head":224,"id":228,"type":149,"uuid":229,"symbolIds":230},{"meta":225,"title":227},{"description":226,"og:image":24},"マジシャンDaiSukeへの出演依頼を検討中の方向けに、よくある質問をQ&A形式で丁寧にまとめたページです。料金の目安、ショーの時間や内容、音響設備の必要性、子ども向け・高齢者向けの演出の違い、障がいがある方への対応、会場が狭い場合の工夫など、これまで多くの方が感じた疑問にすべてお答えします。“初めてでも安心できるか”“失敗しないためには何を確認すればいいのか”を事前に知ることができ、問い合わせの前に不安を解消できます。","よくある質問｜マジックショーの依頼・準備・料金などをわかりやすく解説","よくある質問","e86c0aa9-a6b4-46f5-8296-567398fad6e0",[152,153],{"head":232,"id":236,"type":149,"uuid":237,"symbolIds":238},{"meta":233,"title":235},{"description":234,"og:image":24},"マジシャンDaiSukeがこれまでに出演したマジックショーの様子を、写真や動画で豊富に紹介するギャラリーページ。福祉施設・企業イベント・学校公演・地域のお祭りなど、年齢や場所を問わず、観客の笑顔と驚きに包まれたリアルな瞬間が多数掲載されています。視覚障がいというハンディキャップを乗り越えた感動のステージ、子どもたちの純粋なリアクション、ステージ演出の工夫など、マジックショーの雰囲気を事前にしっかり確認できます。“どんな雰囲気か知りたい”“実績を写真で見たい”“依頼前に参考にしたい”という方に最適。マジックパフォーマンスの臨場感と、DaiSukeの世界観がひと目で伝わるギャラリーは、安心感と期待感を高める重要コンテンツです。","マジシャンDaiSukeのギャラリー｜笑顔あふれるパフォーマンスの瞬間","ギャラリー","70c1267e-a2c7-4754-a0dc-4f4a13c21a07",[152,153],{"head":240,"id":245,"type":149,"uuid":246,"symbolIds":247},{"favicon":241,"meta":242,"title":244},"https:\u002F\u002Fstorage.googleapis.com\u002Fproduction-os-assets\u002Fassets\u002F2840c74c-a928-42c4-b883-9811e95cf9ed",{"description":243,"og:image":146},"マジシャンDaiSukeへの出演依頼・料金相談・日程確認・講演依頼など、あらゆるお問い合わせを受け付ける専用フォームページです。企業のイベントご担当者様、福祉施設のご関係者、学校関係者、地域イベント主催者、個人のお客様まで、どなたでもお気軽にご相談可能です。イベントの目的や規模、ご予算、ご希望日時、会場の条件に応じた柔軟なご提案が可能で、“初めてでよくわからない”という方にも丁寧に対応。お問い合わせ後は迅速かつ丁寧な対応を心がけており、演出内容や料金についての不安や疑問もすぐに解消できます。感動と笑顔を届ける出張マジックを成功させたいすべての方へ、最初の一歩を安心して踏み出せる窓口です。","出演依頼・お問い合わせ｜マジシャンDaiSukeへのご連絡はこちら","お問い合わせ","aa5bf87e-f6b2-4a20-9580-cd3f0feeb27b",[152,153],{"head":249,"id":251,"type":149,"uuid":252,"symbolIds":253},{"meta":250,"title":24},{"description":24,"og:image":24},"プライバシーポリシー","78550ddf-32c2-4037-a7ad-adf135adbe62",[152,153],{"head":255,"id":258,"isPrivate":10,"type":259,"uuid":260,"symbolIds":261},{"meta":256,"title":24},{"robots":257},"noindex","8","password","4bcc7fe6-2aac-4990-98a2-12d489161f62",[],{"head":263,"id":266,"type":149,"uuid":267,"symbolIds":268},{"favicon":264,"meta":265,"title":24},"https:\u002F\u002Fstorage.googleapis.com\u002Fproduction-os-assets\u002Fassets\u002Ffd1aad11-cd0e-4425-bab5-b8ffa17d6e98",{"description":24,"og:image":24},"
